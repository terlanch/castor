server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API + discovery files to backend
  location /api/ {
    proxy_pass http://castor-backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /skill.md { proxy_pass http://castor-backend:8080; }
  location = /skill.json { proxy_pass http://castor-backend:8080; }
  location = /heartbeat.md { proxy_pass http://castor-backend:8080; }
  location = /openapi.json { proxy_pass http://castor-backend:8080; }

  location /docs/ { proxy_pass http://castor-backend:8080; }
  location /scripts/ { proxy_pass http://castor-backend:8080; }
}

